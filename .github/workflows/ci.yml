name: Windows quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install the locked dependencies and verify SQLite runtime
        run: npm ci
      - name: Check formatting, lint, build and tests
        run: npm run check
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Smoke test desktop workflows with isolated synthetic data
        run: npm run smoke:desktop
      - name: Package the Windows application
        run: npm run pack
      - name: Smoke test the packaged Windows application
        run: npm run smoke:packaged
